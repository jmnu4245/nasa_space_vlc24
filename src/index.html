<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Simulación Espacial</title>
    <meta name="description" content="Planetario interactivo del Sistema Solar con posiciones reales, eclipses, naves espaciales, asteroides, cometas y cálculos orbitales.">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <!-- Iconos reutilizables (trazo fino, 1.6) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-capas" viewBox="0 0 24 24"><path d="M12 3.5 3 8l9 4.5L21 8l-9-4.5Zm-9 8.5 9 4.5 9-4.5M3 16l9 4.5 9-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-compartir" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1m2 5a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-ayuda" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.6 9.5a2.4 2.4 0 1 1 3.4 2.2c-.6.3-1 .9-1 1.6v.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1" fill="currentColor"/></symbol>
      <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-pausa" viewBox="0 0 24 24"><path d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z" fill="currentColor"/></symbol>
      <symbol id="i-lento" viewBox="0 0 24 24"><path d="M11 7v10l-7-5zM19.5 7v10l-7-5z" fill="currentColor"/></symbol>
      <symbol id="i-rapido" viewBox="0 0 24 24"><path d="M13 7v10l7-5zM4.5 7v10l7-5z" fill="currentColor"/></symbol>
      <symbol id="i-sentido" viewBox="0 0 24 24"><path d="M4 9h13l-3-3M20 15H7l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-lupa" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-sistema" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4" fill="currentColor"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".35"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></symbol>
      <symbol id="i-eventos" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-tour" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9.2v5.6l4.6-2.8z" fill="currentColor"/></symbol>
      <symbol id="i-regla" viewBox="0 0 24 24"><path d="M3.5 16.5 16.5 3.5l4 4-13 13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m7 13 2 2m1-5 1.5 1.5M13 7l2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    </svg>

    <!-- Pantalla de carga -->
    <div id="carga">
      <div class="carga-titulo" data-i18n="titulo">Sistema Solar</div>
      <div class="carga-barra"><div id="carga-progreso"></div></div>
      <div class="carga-texto" data-i18n="cargando">Cargando texturas…</div>
    </div>

    <div id="etiquetas"></div>
    <div id="regla-etiqueta" hidden></div>

    <!-- Barra superior -->
    <header id="barra-superior">
      <div class="marca"><svg><use href="#i-sistema"/></svg><span data-i18n="titulo">Sistema Solar</span></div>
      <div class="buscador" role="combobox" aria-haspopup="listbox" aria-owns="sugerencias">
        <svg class="lupa"><use href="#i-lupa"/></svg>
        <input type="search" id="buscador" data-i18n-placeholder="buscar" autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-controls="sugerencias">
        <ul id="sugerencias" role="listbox" hidden></ul>
      </div>
      <nav class="acciones">
        <button class="boton-icono" id="btn-eventos" data-i18n-title="eventos"><svg><use href="#i-eventos"/></svg></button>
        <button class="boton-icono" id="btn-tour" data-i18n-title="tour"><svg><use href="#i-tour"/></svg></button>
        <button class="boton-icono" id="btn-regla" data-i18n-title="regla"><svg><use href="#i-regla"/></svg></button>
        <span class="divisor"></span>
        <button class="boton-icono" id="btn-capas" data-i18n-title="capas"><svg><use href="#i-capas"/></svg></button>
        <button class="boton-icono" id="btn-compartir" data-i18n-title="compartir"><svg><use href="#i-compartir"/></svg></button>
        <button class="boton-icono boton-texto" id="btn-idioma" title="English / Español">EN</button>
        <button class="boton-icono" id="btn-ayuda" data-i18n-title="ayuda"><svg><use href="#i-ayuda"/></svg></button>
      </nav>
    </header>

    <!-- Ficha del objeto seleccionado -->
    <aside id="ficha" class="panel" hidden>
      <div class="ficha-cabecera">
        <div>
          <div id="ficha-tipo" class="ficha-tipo"></div>
          <h2 id="ficha-nombre"></h2>
        </div>
        <button class="boton-icono pequeño" id="ficha-cerrar" data-i18n-title="vistaGeneral"><svg><use href="#i-cerrar"/></svg></button>
      </div>
      <div class="pestañas" role="tablist">
        <button role="tab" class="pestaña activa" data-pestaña="info" data-i18n="info">Información</button>
        <button role="tab" class="pestaña" data-pestaña="fisica" data-i18n="fisica">Física</button>
      </div>
      <div class="ficha-cuerpo" id="ficha-info"></div>
      <div class="ficha-cuerpo" id="ficha-fisica" hidden>
        <div class="segmentado" role="radiogroup">
          <button data-metodo="kepler" class="activo" data-i18n="kepler">Kepler</button>
          <button data-metodo="clasica" data-i18n="clasica">Clásica</button>
          <button data-metodo="relatividad" data-i18n="relatividad">Relatividad</button>
        </div>
        <div id="integradores" hidden>
          <label><input type="checkbox" value="euler" checked> <span data-i18n="metodoEuler">Método de Euler</span></label>
          <label><input type="checkbox" value="rk4" checked> <span data-i18n="metodoRK4">Runge-Kutta 4</span></label>
        </div>
        <p class="nota" id="explicacion-metodo"></p>
        <div id="resultados"></div>
      </div>
    </aside>

    <!-- Panel de capas -->
    <section id="panel-capas" class="panel panel-lateral" hidden>
      <h3 data-i18n="capas">Capas</h3>
      <label class="interruptor"><input type="checkbox" data-capa="etiquetas" checked><span data-i18n="etiquetas">Etiquetas</span></label>
      <label class="interruptor"><input type="checkbox" data-capa="orbitas" checked><span data-i18n="orbitas">Órbitas</span></label>
      <label class="interruptor"><input type="checkbox" data-capa="lunas" checked><span data-i18n="lunas">Lunas</span></label>
      <label class="interruptor"><input type="checkbox" data-capa="naves" checked><span data-i18n="naves">Naves</span></label>
      <label class="interruptor"><input type="checkbox" data-capa="cinturones" checked><span data-i18n="cinturones">Cinturones</span></label>
      <label class="interruptor"><input type="checkbox" data-capa="colas" checked><span data-i18n="colas">Colas de los cometas</span></label>
      <label class="interruptor"><input type="checkbox" data-capa="escalaReal"><span data-i18n="escalaReal">Tamaños a escala real</span></label>
      <div class="deslizador">
        <div><span data-i18n="asteroides">Asteroides</span><output id="valor-asteroides">0</output></div>
        <input type="range" data-capa="asteroides" min="0" max="0" value="0">
      </div>
      <div class="deslizador">
        <div><span data-i18n="cometas">Cometas</span><output id="valor-cometas">0</output></div>
        <input type="range" data-capa="cometas" min="0" max="0" value="0">
      </div>
      <div class="deslizador">
        <div><span data-i18n="brilloFondo">Vía Láctea</span><output id="valor-fondo">45</output></div>
        <input type="range" data-capa="fondo" min="0" max="100" value="45">
      </div>
    </section>

    <!-- Panel de eventos astronómicos -->
    <section id="panel-eventos" class="panel panel-lateral" hidden>
      <h3 data-i18n="eventos">Eventos</h3>
      <div id="lista-eventos"></div>
    </section>

    <!-- Selector de astros en arco (esquina inferior derecha) -->
    <nav id="arco" aria-label="Astros">
      <div id="arco-nombre"></div>
      <button id="arco-centro" class="arco-astro" data-id="vista-general" data-i18n-title="vistaGeneral"><svg><use href="#i-sistema"/></svg></button>
    </nav>

    <!-- Control del tiempo -->
    <div id="control-tiempo" class="panel">
      <button class="boton-icono" id="btn-sentido" data-i18n-title="haciaAtras"><svg><use href="#i-sentido"/></svg></button>
      <button class="boton-icono" id="btn-lento" data-i18n-title="masLento"><svg><use href="#i-lento"/></svg></button>
      <button class="boton-icono principal" id="btn-play" data-i18n-title="pausa"><svg><use href="#i-pausa"/></svg></button>
      <button class="boton-icono" id="btn-rapido" data-i18n-title="masRapido"><svg><use href="#i-rapido"/></svg></button>
      <div class="velocidad" id="velocidad"></div>
      <div class="separador"></div>
      <button class="fecha" id="btn-fecha" data-i18n-title="elegirFecha">
        <span id="fecha"></span>
        <small id="dia-juliano"></small>
      </button>
      <input type="date" id="fecha-input" tabindex="-1" aria-hidden="true">
      <button class="boton-texto-plano" id="btn-hoy" data-i18n="hoy">Hoy</button>
    </div>

    <!-- Modo cine (tour) -->
    <div id="cine" hidden>
      <div class="franja superior"></div>
      <div class="franja inferior"></div>
      <div id="cine-texto">
        <div id="cine-paso"></div>
        <h2 id="cine-titulo"></h2>
        <p id="cine-subtitulo"></p>
      </div>
      <div id="cine-progreso"></div>
      <button id="cine-salir" data-i18n="salirTour">Salir · Esc</button>
    </div>

    <!-- Ayuda -->
    <div id="ayuda" class="capa-modal" hidden>
      <div class="panel modal">
        <h2 data-i18n="ayudaTitulo">Cómo usar el simulador</h2>
        <dl id="ayuda-lista"></dl>
        <p class="nota" data-i18n="escalaAviso"></p>
        <button class="boton-principal" id="ayuda-cerrar" data-i18n="entendido">Entendido</button>
      </div>
    </div>

    <div id="aviso" role="status" aria-live="polite"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
